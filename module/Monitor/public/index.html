<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hydra Monitor</title>
<style>
:root{
  --ink:#141414; --dim:#6b6b6b; --faint:#a8a8a8; --line:#e3e3e0; --paper:#fcfcfb; --card:#fff;
  --live:#1f8a55; --dead:#a33a2c; --warn:#8a6a1f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:30px 26px 120px}

header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-size:15px;letter-spacing:.02em;font-weight:600}
.brand span{color:var(--faint);font-weight:400}
.counts{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.agent{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.bulb{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.bulb.live{background:var(--live);box-shadow:0 0 0 3px rgba(31,138,85,.13)}
.bulb.dead{background:var(--dead);box-shadow:0 0 0 3px rgba(163,58,44,.12)}
.bulb.warn{background:var(--warn)}

.stage{position:relative;margin-top:34px;min-height:430px}
.slide{display:none;animation:fade .35s ease}
.slide.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.kicker{display:flex;gap:12px;align-items:center;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.chip{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border:1px solid var(--line);border-radius:99px;color:var(--dim)}
.chip.active{color:var(--ink);border-color:#cfcfcb}
.chip.blocked{color:var(--dead);border-color:#e8cfca}
.chip.parked{color:var(--warn);border-color:#e6dcc4}
.chip.done{color:var(--live);border-color:#cbe0d4}

h1{font-size:clamp(24px,3.1vw,36px);line-height:1.18;letter-spacing:-.015em;margin:14px 0 10px;font-weight:600;max-width:20ch}
h1.wide{max-width:34ch}
.intent{color:var(--dim);font-size:15.5px;max-width:66ch;margin:0 0 26px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;font-weight:600}
ul.q{margin:0;padding:0;list-style:none}
ul.q li{position:relative;padding:0 0 9px 16px;font-size:14.5px;color:#2a2a2a}
ul.q li:before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:#d3d3cf}
ul.q li.more{color:var(--faint);font-size:13px;padding-left:16px}
.msg{border-left:2px solid var(--line);padding:0 0 0 12px;margin:0 0 14px}
.msg .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.msg p{margin:3px 0 0;font-size:14px;color:#2d2d2d}

.ask{margin-top:28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
button.act{font:inherit;font-size:13.5px;padding:9px 18px;border-radius:8px;border:1px solid #141414;background:#141414;color:#fff;cursor:pointer;transition:opacity .2s}
button.act:hover{opacity:.85}
button.act[disabled]{background:#fff;color:var(--faint);border-color:var(--line);cursor:not-allowed}
.hint{font-size:12.5px;color:var(--faint)}
.answer{margin-top:16px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:16px 18px;display:none;max-width:78ch}
.answer.on{display:block}
.answer .meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.answer .body{white-space:pre-wrap;font-size:14.5px;color:#222}
.answer .body.err{color:var(--dead)}

.board-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:8px}
.mini{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--card);cursor:pointer;transition:border-color .15s,transform .15s}
.mini:hover{border-color:#c9c9c4;transform:translateY(-1px)}
.mini .t{font-size:14px;font-weight:550;line-height:1.35;margin-bottom:6px}
.mini .m{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}

footer{position:fixed;left:0;right:0;bottom:0;background:rgba(252,252,251,.94);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:14px 26px 16px}
.footin{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px}
.dots{display:flex;flex-wrap:wrap;gap:9px;flex:1;justify-content:center}
.dot{width:10px;height:10px;padding:0;border:1px solid #bcbcb7;border-radius:50%;background:transparent;cursor:pointer;transition:background .2s,transform .2s,border-color .2s}
.dot:hover{border-color:#141414}
.dot.on{background:#141414;border-color:#141414;transform:scale(1.35)}
.dot.blocked{border-color:#d8a79c}
.dot.parked{border-color:#d8c79c}
.dot.done{border-color:#a9cdb9}
.nav{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--dim);border-radius:7px;padding:6px 12px;cursor:pointer}
.nav:hover{color:var(--ink);border-color:#c9c9c4}
.pos{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Hydra&nbsp;Monitor <span>· train of thought</span></div>
    <div class="counts" id="counts"></div>
    <div class="spacer"></div>
    <div class="agent"><span class="bulb" id="bulb"></span><span id="agenttext">probing agent…</span></div>
  </header>

  <div class="stage" id="stage">
    <div class="slide on" id="boot"><div class="kicker">loading</div><h1>Reading the train of thought…</h1></div>
  </div>
</div>

<footer>
  <div class="footin">
    <button class="nav" id="prev">← Previous</button>
    <div class="dots" id="dots"></div>
    <div class="pos" id="pos"></div>
    <button class="nav" id="pause">Pause</button>
    <button class="nav" id="next">Next →</button>
  </div>
</footer>

<script>
(() => {
  const stage = document.getElementById('stage');
  const dotsEl = document.getElementById('dots');
  const posEl = document.getElementById('pos');
  const pauseBtn = document.getElementById('pause');
  const bulb = document.getElementById('bulb');
  const agentText = document.getElementById('agenttext');
  const countsEl = document.getElementById('counts');

  let slides = [], dots = [], current = 0, timer = null, paused = false, agent = { alive: false };
  const INTERVAL = 12000;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cut = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };

  function probe() {
    fetch('/api/agent').then(r => r.json()).then(a => {
      agent = a;
      bulb.className = 'bulb ' + (a.alive ? 'live' : (a.why === 'no_key' ? 'warn' : 'dead'));
      agentText.textContent = a.alive
        ? 'agent live · tell mom → echidna · session ' + String(a.session || 'new').slice(0, 12) + '…'
        : 'no agent (' + (a.why || 'down') + ')';
      document.querySelectorAll('button.act').forEach(b => {
        b.disabled = !a.alive;
        b.title = a.alive ? 'Runs the agent on this topic' : 'agent offline: ' + (a.why || 'down');
      });
    }).catch(() => { bulb.className = 'bulb dead'; agentText.textContent = 'monitor cannot reach its own api'; });
  }

  function slideFor(t, i) {
    const el = document.createElement('div');
    el.className = 'slide';
    const q = t.questions.slice(0, 4);
    const rest = t.questions.length - q.length;
    el.innerHTML = `
      <div class="kicker"><span class="chip ${esc(t.state)}">${esc(t.state)}</span><span>${esc(t.ref)}</span>
        ${t.tags.length ? '<span>· ' + t.tags.slice(0,3).map(esc).join(' · ') + '</span>' : ''}
        <span>· ${t.trailCount} trail</span></div>
      <h1>${esc(t.title)}</h1>
      ${t.intent ? `<p class="intent">${esc(cut(t.intent, 300))}</p>` : ''}
      <div class="grid">
        <div>
          <h2>Unanswered · ${t.questions.length}</h2>
          <ul class="q">${q.map(x => `<li>${esc(cut(x, 230))}</li>`).join('') || '<li class="more">nothing open on this topic</li>'}
          ${rest > 0 ? `<li class="more">+ ${rest} more</li>` : ''}</ul>
        </div>
        <div>
          <h2>Key messages</h2>
          ${t.messages.slice(0, 2).map(m => `<div class="msg"><div class="k">${esc(m.kind)}</div><p>${esc(cut(m.text, 300))}</p></div>`).join('') || '<div class="msg"><p>no trail yet</p></div>'}
        </div>
      </div>
      <div class="ask">
        <button class="act" data-ref="${esc(t.ref)}" ${agent.alive ? '' : 'disabled'}>Tell Mom about this</button>
        <span class="hint">Tell Mom → Echidna's agent · the note and the question land in its own session, and the answer comes back here</span>
      </div>
      <div class="answer"><div class="meta"></div><div class="body"></div></div>`;
    el.querySelector('button.act').addEventListener('click', ev => ask(el, ev.currentTarget));
    return el;
  }

  function boardSlide(doc) {
    const el = document.createElement('div');
    el.className = 'slide';
    const blocked = doc.topics.filter(t => t.state === 'blocked');
    const parked = doc.topics.filter(t => t.state === 'parked');
    const top = doc.topics.slice(0, 8);
    el.innerHTML = `
      <div class="kicker"><span class="chip">board</span><span>${doc.topics.length} topics</span></div>
      <h1 class="wide">Every topic, and the agent that can answer for it</h1>
      <p class="intent">${Object.entries(doc.counts).map(([k,v]) => v + ' ' + k).join(' · ')}${blocked.length ? ' — blocked: ' + blocked.map(t => esc(t.title)).join(', ') : ''}${parked.length ? ' · parked: ' + parked.map(t => esc(t.title)).join(', ') : ''}</p>
      <h2>Take up next</h2>
      <div class="board-list">${top.map((t, i) => `<div class="mini" data-i="${i + 1}"><div class="t">${esc(cut(t.title, 70))}</div><div class="m">${esc(t.state)} · ${t.questions.length} open</div></div>`).join('')}</div>`;
    el.querySelectorAll('.mini').forEach(m => m.addEventListener('click', () => { show(Number(m.dataset.i)); restart(); }));
    return el;
  }

  async function ask(el, btn) {
    const box = el.querySelector('.answer');
    const meta = box.querySelector('.meta');
    const bodyEl = box.querySelector('.body');
    box.classList.add('on');
    meta.textContent = 'asking the agent…';
    bodyEl.className = 'body';
    bodyEl.textContent = '';
    btn.disabled = true;
    try {
      const r = await fetch('/api/ask', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ ref: btn.dataset.ref })
      });
      const j = await r.json();
      if (j.ok) {
        const told = j.told ? (j.told.ok ? 'told: pane + discord' : 'tell ' + (j.told.why || 'failed')) : '';
        meta.textContent = 'answered in ' + (j.ms / 1000).toFixed(1) + 's' + (told ? ' · ' + told : '') + (j.sessionId ? ' · session ' + String(j.sessionId).slice(0, 12) + '…' : '');
        bodyEl.textContent = j.answer || '(empty answer)';
      } else {
        meta.textContent = 'agent did not answer · ' + (j.why || 'unknown');
        bodyEl.className = 'body err';
        bodyEl.textContent = (j.note || '') + (j.why === 'no_key' ? '\nThe key is read per call from the owner .env; nothing is stored here.' : '');
      }
    } catch (e) {
      meta.textContent = 'monitor could not ask';
      bodyEl.className = 'body err';
      bodyEl.textContent = String(e);
    }
    btn.disabled = !agent.alive;
  }

  function show(i) {
    current = Math.max(0, Math.min(i, slides.length - 1));
    slides.forEach((s, k) => s.classList.toggle('on', k === current));
    dots.forEach((d, k) => { d.classList.toggle('on', k === current); d.setAttribute('aria-current', k === current ? 'true' : 'false'); });
    posEl.textContent = (current + 1) + ' / ' + slides.length;
    if (slides[current] && slides[current].scrollIntoView) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function restart() { clearInterval(timer); if (!paused) timer = setInterval(() => show((current + 1) % slides.length), INTERVAL); }

  function build(doc) {
    stage.innerHTML = '';
    dotsEl.innerHTML = '';
    slides = [boardSlide(doc), ...doc.topics.map(slideFor)];
    dots = slides.map((s, i) => {
      const b = document.createElement('button');
      b.className = 'dot' + (i === 0 ? '' : ' ' + (doc.topics[i - 1].state || ''));
      b.title = i === 0 ? 'board' : doc.topics[i - 1].title;
      b.setAttribute('aria-label', b.title);
      b.addEventListener('click', () => { show(i); restart(); });
      dotsEl.appendChild(b);
      stage.appendChild(s);
      return b;
    });
    countsEl.textContent = doc.topics.length + ' topics · ' + doc.topics.reduce((n, t) => n + t.questions.length, 0) + ' open questions';
    show(0); restart();
  }

  document.getElementById('next').onclick = () => { show(current + 1); restart(); };
  document.getElementById('prev').onclick = () => { show(current - 1); restart(); };
  pauseBtn.onclick = () => { paused = !paused; pauseBtn.textContent = paused ? 'Resume' : 'Pause'; restart(); };
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { show(current + 1); restart(); }
    if (e.key === 'ArrowLeft') { show(current - 1); restart(); }
    if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); }
  });
  const holdOn = () => clearInterval(timer);
  const holdOff = () => restart();
  stage.addEventListener('mouseenter', holdOn);
  stage.addEventListener('mouseleave', holdOff);
  document.addEventListener('visibilitychange', () => document.hidden ? holdOn() : restart());

  probe(); setInterval(probe, 10000);
  fetch('/api/topics').then(r => r.json()).then(doc => {
    if (!doc.ok) { stage.innerHTML = '<div class="slide on"><div class="kicker">refused</div><h1>The board cannot read its input</h1><p class="intent">' + esc(doc.path) + ' — ' + esc(doc.why) + '</p></div>'; return; }
    build(doc);
  }).catch(e => { stage.innerHTML = '<div class="slide on"><h1>Monitor API unreachable</h1><p class="intent">' + esc(String(e)) + '</p></div>'; });
})();
</script>
</body>
</html>
