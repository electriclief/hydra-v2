<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="What this machine can make locally: text, image, video and music — no cloud, no account.">
<title>Local AI Menu Tree</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111318;
    --panel: #191c23;
    --hover: #252a35;
    --border: #303541;
    --text: #e5e7eb;
    --muted: #a1a8b7;
    --accent: #8ab4f8;
    --bad: #e0a0a0;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .wrap {
    display: grid;
    grid-template-columns: minmax(300px, 420px) 1fr;
    gap: 14px;
    padding: 14px;
    height: 100vh;
  }

  /* ── the tree ─────────────────────────────────────────────────────────── */
  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .brand {
    padding: 2px 8px 12px;
  }
  .brand svg { display: block; width: 236px; height: auto; }

  .tree-heading {
    margin: 0 0 10px;
    padding: 4px 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .tree-heading b { color: var(--text); font-weight: 600; }

  .hint {
    margin: 0 8px 10px;
    color: var(--muted);
    font-size: 12px;
  }

  .scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
  }

  .tree {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .node { margin: 3px 0; }

  /* ── other nodes on the LAN ────────────────────────────────────────────
     Same tree, repeated per node. Hidden when there is nobody else, so a
     single-box install looks exactly as it did before. */
  .lan {
    flex: 0 0 auto;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .lan[hidden] { display: none; }

  /* the heading stays put while the peers scroll under it, so a long LAN list still says whose it is */
  .lan .tree-heading {
    position: sticky;
    top: 0;
    z-index: 1;
    margin-bottom: 6px;
    background: var(--panel);
  }

  .node-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
  }

  .node-head b { font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }

  .chip {
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .chip.alive { color: #9ad39a; border-color: #3c5a3c; }
  .chip.stalled { color: #e2c48a; border-color: #5a4c2f; }
  .chip.gone { color: var(--bad); border-color: #5a3636; }

  .lan-list { list-style: none; margin: 0; padding: 0 8px 6px; }

  .lan-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 3px 0;
  }

  .lan-name { color: var(--text); }

  .lan-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .lan-empty { margin: 0 8px; color: var(--muted); font-size: 12px; }

  .rowline { display: flex; align-items: stretch; gap: 2px; }

  /* the arrow: its own button, because it does its own job (open the detail) */
  .disc {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    flex: 0 0 26px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
    color: var(--muted);
  }

  .disc:hover { background: var(--hover); border-color: var(--border); }
  .disc:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chevron {
    display: block;
    width: 12px;
    height: 12px;
    transition: transform .15s;
  }

  .chevron::before {
    content: "";
    display: block;
    width: 0;
    height: 0;
    margin: 3px 0 0 3px;
    border-left: 5px solid currentColor;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
  }

  .disc[aria-expanded="true"] .chevron { transform: rotate(90deg); }

  .row {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 1;
    min-width: 0;
    padding: 9px 10px;
    border: 1px solid transparent;
    border-radius: 7px;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  .row:hover, .row.sel { background: var(--hover); border-color: var(--border); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row.refused { color: var(--muted); cursor: not-allowed; }

  .emoji { font-size: 17px; line-height: 1; }
  .node-name { font-weight: 600; overflow-wrap: anywhere; }

  /* the type appends to the name — no auto margin, no far edge */
  .type {
    padding: 1px 7px;
    border: 1px solid #3a4b65;
    border-radius: 5px;
    color: var(--accent);
    font-size: 11px;
    white-space: nowrap;
  }

  .type.refused { border-color: #5a3030; color: var(--bad); }

  .detail {
    margin: 5px 8px 10px 34px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.65;
  }

  .detail p { margin: 0 0 6px; }

  /* the empty advert line is a smell test, not a paragraph: two lines, then the models */
  .detail > p:first-child {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .detail p:last-child { margin-bottom: 0; }
  .detail b { color: var(--text); font-weight: 600; }

  .detail .models {
    list-style: none;
    margin: 0 0 8px;
    padding: 0;
  }

  .detail .models li { margin: 2px 0; }

  .detail .size {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .detail code {
    font: 11px ui-monospace, Consolas, monospace;
    color: var(--accent);
  }

  .detail .wants .lab,
  .detail .byline {
    color: #7d8998;
  }

  .detail .fit {
    margin-top: 8px;
    padding: 7px 9px;
    border-left: 2px solid var(--border);
    background: rgba(255, 255, 255, .02);
    color: #b6bec9;
  }

  .foot {
    margin: 10px 8px 0;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
  }

  .foot a { color: var(--accent); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  /* ── the stage ────────────────────────────────────────────────────────── */
  .stage {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .stage-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }

  .stage-head b { font-size: 14px; font-weight: 600; }
  .stage-head .meta { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .switch { display: flex; gap: 4px; margin-left: auto; }

  .switch button {
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }

  .switch button:hover { background: var(--hover); color: var(--text); }
  .switch button[aria-pressed="true"] { border-color: #3a4b65; color: var(--accent); }
  .switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stage-head .full { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .stage-head .full:hover { text-decoration: underline; }

  iframe { flex: 1; width: 100%; border: 0; background: #0d1117; min-height: 0; }

  /* the model chooser lives in the tree, under its service */
  .mods {
    list-style: none;
    margin: 2px 0 10px 22px;
    padding: 0 0 0 10px;
    border-left: 1px solid var(--border);
  }

  .mod {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    padding: 5px 8px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .mod:hover { background: var(--hover); color: var(--text); }
  .mod.sel { background: #1d2531; border-color: #33415a; color: var(--text); }
  .mod .mname { font-weight: 600; }
  .mod .mquant { font-size: 11px; color: var(--accent); }
  .mod .msize { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12px; }
  .mod .mdot { width: 12px; text-align: center; font-size: 11px; }
  .mod .ok { color: #7fd4a0; }
  .mod .warn { color: #e2b04a; }
  .mod .gone { color: #d9736b; }

  /* the right pane when a model is chosen: specs, not an iframe */
  .model-pane {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 22px 26px 30px;
  }

  .m-title { font-size: 19px; font-weight: 600; color: var(--text); }
  .m-title .q { color: var(--accent); font-weight: 500; }
  .m-sub { margin-top: 4px; color: var(--muted); font-size: 12px; }

  .m-grid {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 4px 16px;
    margin: 18px 0 6px;
    font-size: 12.5px;
  }

  .m-grid .k { color: #7d8998; }
  .m-grid .v { color: var(--text); overflow-wrap: anywhere; }
  .m-grid .v.mono { font: 11.5px ui-monospace, Consolas, monospace; color: var(--accent); }

  .m-wants, .m-fit { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }
  .m-fit { padding: 8px 10px; border-left: 2px solid var(--border); background: rgba(255,255,255,.02); }

  .m-runs { margin-top: 20px; }
  .m-runs h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #7d8998; font-weight: 600; }
  .m-runs table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .m-runs td { padding: 4px 10px 4px 0; color: var(--muted); }
  .m-runs td:first-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .m-runs tr.h td { padding-bottom: 6px; color: #6c7787; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
  .m-runs tr.h td:first-child { color: #6c7787; }

  .m-launch { margin-top: 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .m-launch button {
    padding: 9px 20px;
    border: 1px solid #3a4b65;
    border-radius: 8px;
    background: #1d2733;
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .m-launch button:hover { background: #24303f; border-color: var(--accent); }
  .m-launch button:disabled { opacity: .5; cursor: default; }
  .m-launch .line { color: var(--muted); font-size: 12.5px; }
  .m-launch .line b { color: var(--text); }

  .notice { padding: 22px; color: var(--muted); font-size: 13px; }
  .notice b { color: var(--text); }

  @media (max-width: 820px) {
    body { overflow: auto; }
    .wrap { grid-template-columns: 1fr; height: auto; }
    .tree { max-height: 44vh; }
    .stage { height: 70vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    .row, .chevron { transition: none; }
  }
</style>
</head>

    <h1 class="tree-heading">Local AI <b>menu</b></h1>
    <p class="hint">Hover or ↑ ↓ to read an advert · <b>click</b> to open its inputs · <b>arrow</b> opens the models</p>
    <div class="scroll" id="scroll">
    <ul class="tree" id="tree" aria-label="Local AI services">
      <li class="node"><span class="notice">reading the catalog…</span></li>
    </ul>
    <section class="lan" id="lan" aria-label="Other nodes on this LAN" hidden>
      <h2 class="tree-heading">Nodes on this <b>LAN</b></h2>
      <div id="lan-body"></div>
    </section>
    </div>
    <p class="foot"><a id="book-link" href="#" target="_blank" rel="noreferrer">Scheduler — the book of jobs →</a></p>
  </aside>

  <main class="stage">
    <div class="stage-head">
      <b id="pane-name">—</b>
      <span class="meta" id="pane-meta"></span>
      <span class="switch">
        <button type="button" id="tab-advert" aria-pressed="true">advert</button>
        <button type="button" id="tab-inputs" aria-pressed="false">inputs</button>
      </span>
      <a class="full" id="pane-full" href="#" hidden>full page ↗</a>
    </div>
    <div class="model-pane" id="model-pane" hidden></div>
    <iframe id="pane" title="the selected service" sandbox="allow-same-origin allow-forms allow-scripts"></iframe>
  </main>
</div>

<script>
(function () {
  var tree = document.getElementById('tree');
  var pane = document.getElementById('pane');
  var paneName = document.getElementById('pane-name');
  var paneMeta = document.getElementById('pane-meta');
  var paneFull = document.getElementById('pane-full');
  var tabAdvert = document.getElementById('tab-advert');
  var tabInputs = document.getElementById('tab-inputs');
  var bookLink = document.getElementById('book-link');

  var modelPane = document.getElementById('model-pane');
  var rows = [];
  var state = { name: null, mode: 'advert', model: null };
  var chips = {};

  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function show(name, mode, row) {
    if (!name) return;
    state.name = name;
    state.mode = mode;
    state.model = null;
    // the model pane and the framed pages take turns; only one is ever visible
    var isModel = mode === 'model';
    modelPane.hidden = !isModel;
    pane.hidden = isModel;
    if (!isModel) pane.src = '/' + mode + '/' + encodeURIComponent(name) + '?embed=1';
    paneName.textContent = name;
    paneMeta.textContent = row ? row.meta : '';
    paneFull.href = '/' + mode + '/' + encodeURIComponent(name);
    paneFull.hidden = false;
    tabAdvert.setAttribute('aria-pressed', String(mode === 'advert'));
    tabInputs.setAttribute('aria-pressed', String(mode === 'inputs'));
    rows.forEach(function (r) { r.link.classList.toggle('sel', r.name === name); });
  }

  function mark(name) {
    rows.forEach(function (r) { r.link.classList.toggle('sel', r.name === name); });
  }

  function gib(bytes) {
    if (!bytes) return '';
    var g = bytes / 1073741824;
    return (g < 1 ? g.toFixed(2) : g.toFixed(1)) + ' GiB';
  }

  function detail(row) {
    // the arrow opens the advert line and the model rows; the specs live in the right pane
    return '<p>' + esc(row.what) + '</p>'
      + '<p class="byline"><b>' + esc(row.provider || 'unknown provider') + '</b>'
      + (row.karma === null ? '' : ' · karma ' + esc(row.karma))
      + (row.task ? ' · ' + esc(row.task) : '')
      + (row.models && row.models.length ? ' · ' + row.models.length + ' model' + (row.models.length === 1 ? '' : 's') : '')
      + '</p>';
  }

  function build(service) {
    var li = document.createElement('li');
    li.className = 'node';

    var line = document.createElement('div');
    line.className = 'rowline';

    var disc = document.createElement('button');
    disc.type = 'button';
    disc.className = 'disc';
    disc.setAttribute('aria-expanded', 'false');
    disc.setAttribute('aria-label', 'Details for ' + service.name);
    disc.innerHTML = '<span class="chevron" aria-hidden="true"></span>';

    var det = document.createElement('div');
    det.className = 'detail';
    det.id = 'd-' + service.name;
    det.innerHTML = detail(service);

    // the arrow opens one thing: what the service is, and which weights it can run
    var wrapEl = document.createElement('div');
    wrapEl.className = 'detailwrap';
    wrapEl.hidden = true;
    wrapEl.appendChild(det);

    chips[service.name] = {};

    if (service.models && service.models.length) {
      var mods = document.createElement('ul');
      mods.className = 'mods';
      service.models.forEach(function (m) {
        var liM = document.createElement('li');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mod';
        btn.dataset.file = m.file || m.family;
        btn.innerHTML = '<span class="mname">' + esc(m.family) + '</span>'
          + (m.quant ? '<span class="mquant">' + esc(m.quant) + '</span>' : '')
          + '<span class="msize">' + gib(m.bytes) + '</span>'
          + '<span class="mdot" title="not checked on disk yet">·</span>';
        btn.addEventListener('click', function (ev) {
          ev.stopPropagation();
          openModel(service, m, btn);
        });
        chips[service.name][m.file || m.family] = btn.querySelector('.mdot');
        liM.appendChild(btn);
        mods.appendChild(liM);
      });
      wrapEl.appendChild(mods);
    }

    disc.setAttribute('aria-controls', det.id);

    var badge = '<span class="type' + (service.ok ? '' : ' refused') + '">' + esc(service.label) + '</span>';
    var inner = '<span class="emoji" aria-hidden="true">' + service.emoji + '</span>'
      + '<span class="node-name">' + esc(service.name) + '</span>' + badge;

    var link;
    if (service.ok) {
      link = document.createElement('a');
      link.className = 'row';
      link.href = '/inputs/' + encodeURIComponent(service.name);
      link.innerHTML = inner;
    } else {
      link = document.createElement('span');
      link.className = 'row refused';
      link.title = service.what || 'the catalog refused this file';
      link.innerHTML = inner;
    }
    link.dataset.name = service.name;

    var first = (service.models && service.models[0]) || null;
    var meta = [
      service.provider,
      first ? first.family + (first.quant ? ' ' + first.quant : '') + ' ' + gib(first.bytes) : '',
      service.karma === null ? '' : 'karma ' + service.karma
    ].filter(Boolean).join(' · ');
    var row = { name: service.name, ok: service.ok, meta: meta, link: link, detail: det, disc: disc };
    rows.push(row);

    disc.addEventListener('click', function () {
      var open = disc.getAttribute('aria-expanded') === 'true';
      disc.setAttribute('aria-expanded', String(!open));
      wrapEl.hidden = open;
      if (!open) loadChips(service);
    });

    if (service.ok) {
      link.addEventListener('pointerenter', function () {
        // a committed inputs page is not stolen by a passing pointer
        if (state.name === service.name && state.mode === 'inputs') return;
        show(service.name, 'advert', row);
      });
      link.addEventListener('focus', function () {
        if (state.name === service.name && state.mode === 'inputs') return;
        show(service.name, 'advert', row);
      });
      link.addEventListener('click', function (e) {
        // keep the tree where it is: the pane is what changes. Modified clicks still open
        // the real page, because the href is a real href.
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        show(service.name, 'inputs', row);
      });
      link.addEventListener('keydown', function (e) {
        var i = rows.indexOf(row);
        var next = null;
        if (e.key === 'ArrowDown') next = i + 1;
        else if (e.key === 'ArrowUp') next = i - 1;
        else if (e.key === 'Home') next = 0;
        else if (e.key === 'End') next = rows.length - 1;
        else if (e.key === 'ArrowRight') { e.preventDefault(); disc.click(); return; }
        if (next === null) return;
        e.preventDefault();
        var target = rows[Math.max(0, Math.min(rows.length - 1, next))];
        if (target.ok) { target.link.focus(); show(target.name, 'advert', target); }
        else { target.link.scrollIntoView({ block: 'nearest' }); }
      });
    }

    line.appendChild(disc);
    line.appendChild(link);
    li.appendChild(line);
    li.appendChild(wrapEl);
    return li;
  }

  // ---- the model pane: specs, the last few runs, and one button ----

  function dur(ms) {
    if (ms == null) return '—';
    if (ms < 1000) return ms + ' ms';
    if (ms < 60000) return (ms / 1000).toFixed(1) + ' s';
    return Math.round(ms / 60000) + ' min';
  }

  function ago(iso) {
    if (!iso) return '—';
    var t = Date.parse(iso);
    if (isNaN(t)) return String(iso);
    var secs = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (secs < 60) return secs + ' s ago';
    if (secs < 3600) return Math.round(secs / 60) + ' min ago';
    if (secs < 86400) return Math.round(secs / 3600) + ' h ago';
    return new Date(t).toISOString().slice(0, 16).replace('T', ' ');
  }

  // remembered sizes first (instant), then the path is checked and the ticks corrected
  function loadChips(service) {
    if (!service.models || !service.models.length) return;
    var svc = encodeURIComponent(service.name);
    fetch('/api/models/' + svc)
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.models) paintChips(service.name, d.models); })
      .catch(function () {});
    fetch('/api/models/' + svc + '?verify=1')
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.models) paintChips(service.name, d.models); })
      .catch(function () {});
  }

  function paintChips(serviceName, models) {
    var mine = chips[serviceName] || {};
    models.forEach(function (m) {
      var dot = mine[m.file || m.family];
      if (!dot) return;
      if (m.exists === true && !m.changed) { dot.textContent = '✓'; dot.className = 'mdot ok'; dot.title = 'on disk, ' + gib(m.actualBytes); }
      else if (m.exists === true && m.changed) { dot.textContent = '!'; dot.className = 'mdot warn'; dot.title = 'on disk, but ' + gib(m.actualBytes) + ' — the service declares ' + gib(m.bytes); }
      else if (m.exists === false) { dot.textContent = '✕'; dot.className = 'mdot gone'; dot.title = 'not on disk'; }
      else { dot.textContent = '·'; dot.className = 'mdot'; }
    });
  }

  function renderModel(service, model, extra) {
    var phase = extra.phase || 'remembered';
    var runs = extra.runs === undefined ? null : extra.runs;
    var gpu = extra.gpu === undefined ? null : extra.gpu;
    state.gpu = gpu;

    var disk;
    if (model.exists === true && !model.changed) disk = '<span style="color:#7fd4a0">on disk ✓ ' + gib(model.actualBytes) + '</span>';
    else if (model.exists === true && model.changed) disk = '<span style="color:#e2b04a">on disk, but ' + gib(model.actualBytes) + ' — the service declares ' + gib(model.bytes) + '</span>';
    else if (model.exists === false) disk = '<span style="color:#d9736b">not on disk</span>';
    else disk = '<span>not checked yet' + (phase === 'remembered' ? ' — looking…' : '') + '</span>';

    var out = ''
      + '<div class="m-title">' + esc(model.family) + (model.quant ? ' <span class="q">' + esc(model.quant) + '</span>' : '') + '</div>'
      + '<div class="m-sub">' + esc(service.name) + ' · ' + gib(model.bytes) + (model.role ? ' · ' + esc(model.role) : '') + ' · ' + disk + '</div>'
      + '<div class="m-grid">'
      + (model.file ? '<div class="k">file</div><div class="v mono">' + esc(model.file) + '</div>' : '')
      + (model.path ? '<div class="k">path</div><div class="v mono">' + esc(model.path) + '</div>' : '')
      + '<div class="k">size</div><div class="v">' + gib(model.bytes)
        + (model.actualBytes && model.actualBytes !== model.bytes ? ' declared · <b>' + gib(model.actualBytes) + '</b> on disk' : '')
        + '</div>'
      + (model.sha256 ? '<div class="k">sha256</div><div class="v mono">' + esc(model.sha256) + '</div>' : '')
      + (model.vramGb ? '<div class="k">fits in</div><div class="v">' + esc(model.vramGb) + ' GB of VRAM</div>' : '')
      + '<div class="k">provider</div><div class="v">' + esc(service.provider || 'unknown') + (service.task ? ' · ' + esc(service.task) : '') + '</div>'
      + (model.note ? '<div class="k">note</div><div class="v">' + esc(model.note) + '</div>' : '')
      + '</div>';

    if (service.needs) {
      var need = service.needs, bits = [];
      if (need.gpu) bits.push('a GPU');
      if (need.vramGb) bits.push(need.vramGb + ' GB VRAM');
      if (need.ramMb) bits.push((need.ramMb / 1024).toFixed(1) + ' GB RAM');
      if (need.cores) bits.push(need.cores + ' cores');
      if (need.diskGb) bits.push(need.diskGb + ' GB disk');
      if (bits.length) out += '<p class="m-wants"><b>wants</b> ' + esc(bits.join(' · ')) + '</p>';
    }
    if (service.whenItDoesNotFit) out += '<p class="m-fit">' + esc(service.whenItDoesNotFit) + '</p>';

    out += '<div class="m-runs"><h3>last runs</h3>';
    if (runs === null) out += '<div class="line" style="color:var(--muted);font-size:12.5px">reading the book…</div>';
    else if (!runs.length) out += '<div class="line" style="color:var(--muted);font-size:12.5px">nothing booked yet — the first launch writes the first line</div>';
    else out += '<table><tr class="h"><td>when</td><td>took</td><td>status</td><td>model</td></tr>' + runs.map(function (r) {
      return '<tr><td>' + esc(ago(r.at)) + '</td><td>' + dur(r.ms) + '</td><td>' + esc(r.status) + '</td><td>' + esc(r.model || '—') + '</td></tr>';
    }).join('') + '</table>';
    out += '</div>';

    var busy = gpu && gpu.busy;
    var line;
    if (gpu === null) line = 'asking the book whether the GPU is free…';
    else if (gpu.ok === false) line = 'the book is not answering: ' + esc(gpu.error || 'unknown');
    else if (busy && gpu.running) line = '<b>' + esc(gpu.running.service) + '</b> is on the GPU (' + dur(gpu.running.elapsedMs) + ') · one job per GPU, so this waits its turn';
    else if (busy) line = '<b>' + esc(gpu.queued) + '</b> waiting · one job per GPU';
    else line = 'GPU free — this starts now';

    if (model.exists === false) line = '<b>not on disk</b> — ' + line + ' (you can still try)';

    out += '<div class="m-launch">'
      + '<button type="button" id="launch-btn">' + (busy ? 'Queue it' : 'Launch') + '</button>'
      + '<span class="line" id="launch-note">' + line + '</span>'
      + '</div>';

    modelPane.innerHTML = out;
    var btn = document.getElementById('launch-btn');
    if (btn) btn.addEventListener('click', function () { launch(service, model); });

    paneName.textContent = service.name;
    paneMeta.textContent = model.family + (model.quant ? ' ' + model.quant : '') + ' · ' + gib(model.bytes);
  }

  // a booked job tells its own story: booked -> running -> done, or queued behind the GPU
  function watchJob(id, line) {
    var tries = 0;
    function tick() {
      tries++;
      fetch('/api/jobs/' + encodeURIComponent(id))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!line || !line.isConnected) return;
          if (!d.ok || !d.job) return;
          var job = d.job;
          if (job.status === 'running') {
            line.innerHTML = '<b>' + esc(job.id) + ' is running</b> — on the GPU now';
          } else if (job.status === 'done' || job.status === 'failed') {
            var ms = job.startedAt && job.finishedAt ? Date.parse(job.finishedAt) - Date.parse(job.startedAt) : null;
            line.innerHTML = '<b>' + esc(job.id) + ' ' + esc(job.status) + '</b>'
              + (ms != null ? ' in ' + dur(ms) : '')
              + (job.result && job.result.executed === false ? ' · dummy runner, nothing was executed' : '');
            return;
          } else if (job.status === 'queued') {
            line.innerHTML = '<b>' + esc(job.id) + ' queued</b> — waiting for the GPU';
          }
          if (tries < 10) setTimeout(tick, 500);
        })
        .catch(function () {});
    }
    setTimeout(tick, 500);
  }

  function launch(service, model) {
    var btn = document.getElementById('launch-btn');
    var line = document.getElementById('launch-note');
    if (btn) btn.disabled = true;
    if (line) line.textContent = 'booking…';
    fetch('/api/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        service: service.name,
        inputs: model.inputs || (model.file ? { model: model.file } : {}),
        note: 'launched from the menu'
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) {
          if (btn) btn.disabled = false;
          if (line) line.innerHTML = '<b>refused:</b> ' + esc((d.error && d.error.message) || 'the book said no');
          return;
        }
        var job = d.job;
        if (line) line.innerHTML = '<b>' + esc(job.id) + ' booked</b> — starting…';
        watchJob(job.id, line);
        setTimeout(function () { refreshModel(service, model); }, 3200);
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        if (line) line.innerHTML = '<b>the booking call failed:</b> ' + esc(e.message || e);
      });
  }

  function refreshModel(service, model) {
    var svc = encodeURIComponent(service.name);
    Promise.all([
      fetch('/api/models/' + svc + '?verify=1').then(function (r) { return r.json(); }).catch(function () { return null; }),
      fetch('/api/runs/' + svc).then(function (r) { return r.json(); }).catch(function () { return null; }),
      fetch('/api/gpu').then(function (r) { return r.json(); }).catch(function () { return null; })
    ]).then(function (res) {
      if (state.mode !== 'model' || state.name !== service.name) return;
      var answer = res[0];
      if (answer && answer.models) paintChips(service.name, answer.models);
      var fresh = answer && answer.models
        ? answer.models.filter(function (m) { return (m.file || m.family) === (model.file || model.family); })[0]
        : null;
      // the disk answer has no idea what a launch needs; keep the catalog's `inputs`
      var merged = fresh ? Object.assign({}, model, fresh) : model;
      renderModel(service, merged, { phase: 'verified', runs: res[1] && res[1].runs, gpu: res[2] });
    });
  }

  function openModel(service, model, btn) {
    state.name = service.name;
    state.mode = 'model';
    state.model = model.file || model.family;
    mark(service.name);
    Array.prototype.forEach.call(document.querySelectorAll('.mod'), function (b) { b.classList.remove('sel'); });
    if (btn) btn.classList.add('sel');
    modelPane.hidden = false;
    pane.hidden = true;
    paneFull.hidden = true;
    tabAdvert.setAttribute('aria-pressed', 'false');
    tabInputs.setAttribute('aria-pressed', 'false');

    // remembered first: the sizes seen last time, drawn without waiting for the disk…
    renderModel(service, model, { phase: 'remembered' });
    var svc = encodeURIComponent(service.name);
    fetch('/api/models/' + svc)
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.models) paintChips(service.name, d.models); })
      .catch(function () {});
    // …then the path is checked and the rows are corrected
    refreshModel(service, model);
  }

  tabAdvert.addEventListener('click', function () {
    var row = rows.filter(function (r) { return r.name === state.name; })[0];
    if (state.name) show(state.name, 'advert', row);
  });

  tabInputs.addEventListener('click', function () {
    var row = rows.filter(function (r) { return r.name === state.name; })[0];
    if (state.name && row && row.ok) show(state.name, 'inputs', row);
  });

  // ---- the page follows its own file: an edit to index.html shows up in a few seconds,
  //      in the shell or in a browser, with no restart and no rebuild ----
  var pageStamp = null;
  function checkPage() {
    fetch('/api/page-version')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.page) return;
        if (pageStamp === null) { pageStamp = d.page; return; }
        if (pageStamp !== d.page) window.location.reload();
      })
      .catch(function () {});
  }
  checkPage();
  setInterval(checkPage, 4000);

  fetch('/api/menu')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.schedulerUrl) bookLink.href = data.schedulerUrl + '/';
      rows = [];
      tree.innerHTML = '';
      if (data.error) {
        tree.innerHTML = '<li class="node"><span class="notice"><b>the catalog is not answering.</b><br>' + esc(data.error) + '</span></li>';
        return;
      }
      if (!data.services || !data.services.length) {
        tree.innerHTML = '<li class="node"><span class="notice">the catalog is empty — add a service file to <b>Services/services</b></span></li>';
        return;
      }
      data.services.forEach(function (service) { tree.appendChild(build(service)); });
      var first = rows.filter(function (r) { return r.ok; })[0];
      if (first) show(first.name, 'advert', first);
    })
    .catch(function (err) {
      tree.innerHTML = '<li class="node"><span class="notice"><b>this door is up, but the catalog call failed.</b><br>' + esc(err) + '</span></li>';
    });
})();
</script>

<script>
/* ── the rest of the LAN ────────────────────────────────────────────────────
   The section below the local tree is the same idea repeated per node: a heading, the node's chips, its
   services. It reads ONE call (Mirror's /api/lan.json) and renders what is there, including absence.
   If Mirror is not running, the section says so instead of showing a stale LAN. */
(function () {
  var section = document.getElementById('lan');
  var box = document.getElementById('lan-body');
  if (!section || !box) return;

  var url = 'http://127.0.0.1:8137/api/lan.json';
  var busy = false;

  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function ago(iso) {
    var t = Date.parse(iso || '');
    if (!isFinite(t)) return '';
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    return s < 2 ? 'just now' : s + 's ago';
  }

  function render(lan) {
    // include THIS node: the operator wants to see every card on the LAN, including the one under his desk
    var peers = (lan.nodes || []).filter(function (n) { return n.role === 'self'; })
      .concat((lan.nodes || []).filter(function (n) { return n.role !== 'self'; }));
    if (!peers.length) { section.hidden = true; return; }

    box.innerHTML = peers.map(function (n) {
      var chips = [n.verdict];
      chips.push(n.cycle == null ? 'no cycle' : 'cycle ' + n.cycle);
      if (n.standby && !n.standby.stale && n.standby.mode === 'mining') {
        // the chip carries the algorithm when the miner publishes one: a card earning is not a status, it is a fact
        var mdChip = n.standby.minerDetail || null;
        chips.push(mdChip && (mdChip.label || mdChip.algo) ? 'mining ' + (mdChip.label || mdChip.algo) : 'mining');
      }
      if (n.standby && !n.standby.stale && n.standby.mode === 'ai') chips.push('AI');
      if (n.misses) chips.push(n.misses + ' missed');
      if (n.degraded) chips.push('degraded');
      if (n.seenAt) chips.push(ago(n.seenAt));

      var rows = (n.services || []).map(function (s) {
        var meta = (s.ready ? 'ready' : 'not ready') + (s.karma == null ? '' : ' · karma ' + s.karma);
        return '<li class="lan-row"><span class="lan-name">' + esc(s.name) + '</span><span class="lan-meta">' + esc(meta) + '</span></li>';
      }).join('');
      if (!rows) rows = '<li class="lan-row"><span class="lan-meta">no services published</span></li>';

      var booked = (n.booked || []).map(function (b) {
        return '<li class="lan-row"><span class="lan-name">' + esc(b.service || b.id) + '</span><span class="lan-meta">' + esc((b.at || '') + ' · ' + (b.state || 'booked')) + '</span></li>';
      }).join('');
      if (booked) booked = '<li class="lan-row"><span class="lan-meta">booked</span></li>' + booked;

      // WHAT THE CARD IS DOING: one row, always present, because "no report" is information too
      var sb = n.standby;
      var standbyRow;
      if (!sb) {
        standbyRow = '<li class="lan-row"><span class="lan-name">Idle Service</span><span class="lan-meta">no report</span></li>';
      } else if (sb.stale) {
        standbyRow = '<li class="lan-row"><span class="lan-name">Idle Service</span><span class="lan-meta">no report for ' + (sb.ageS == null ? '?' : sb.ageS + 's') + ' - last said ' + esc(sb.mode) + '</span></li>';
      } else if (sb.mode === 'ai') {
        standbyRow = '<li class="lan-row"><span class="lan-name">AI work</span><span class="lan-meta">' + esc((sb.ai || 'unnamed process') + ' - reported ' + sb.ageS + 's ago') + '</span></li>';
      } else if (sb.mode === 'mining') {
        // what the miner says it is doing, not just the word "mining": algorithm and rate, when it reports them
        var md = sb.minerDetail || null;
        var doing = (md && (md.label || md.algo))
          ? (md.label || md.algo) + (typeof md.rate === 'number' ? ' ' + md.rate + ' ' + (md.unit || '') : '')
          : 'mining';
        var shares = (md && typeof md.accepted === 'number') ? ' - ' + md.accepted + ' shares this run' + (md.rejected ? ', ' + md.rejected + ' rejected' : '') : '';
        standbyRow = '<li class="lan-row"><span class="lan-name">Idle Service</span><span class="lan-meta">' + esc(doing.trim()) + shares + ' - reported ' + sb.ageS + 's ago</span></li>';
      } else if (sb.resumeAt) {
        var left = Math.max(0, Math.round((Date.parse(sb.resumeAt) - Date.now()) / 1000));
        standbyRow = '<li class="lan-row"><span class="lan-name">Idle Service</span><span class="lan-meta">idle - resumes in ' + left + 's</span></li>';
      } else {
        standbyRow = '<li class="lan-row"><span class="lan-name">Idle Service</span><span class="lan-meta">idle - standing by</span></li>';
      }

      var title = n.role === 'self' ? 'This node' : 'Node — ' + n.name;
      return '<div class="node">'
        + '<div class="node-head"><b>' + esc(title) + '</b><span class="chips">'
        + chips.map(function (c) { return '<span class="chip ' + esc(n.verdict) + '">' + esc(c) + '</span>'; }).join('')
        + '</span></div>'
        + '<ul class="lan-list">' + standbyRow + rows + booked + '</ul>'
        + '</div>';
    }).join('');
    section.hidden = false;
  }

  function tick() {
    if (busy) return;
    busy = true;
    fetch(url, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('' + r.status); return r.json(); })
      .then(function (lan) { render(lan); })
      .catch(function () {
        section.hidden = false;
        box.innerHTML = '<p class="lan-empty">LAN view unavailable — the Mirror door (8137) is not answering.</p>';
      })
      .then(function () { busy = false; });
  }

  tick();
  setInterval(tick, 5000);
})();
</script>
