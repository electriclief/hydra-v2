<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kate</title>
<style>
  /* Four states, one screen, readable across a room. The state is the loudest thing here on purpose: a person talking
     to a box must never have to guess whether it is hearing them. */
  :root { --ink:#0d0d0d; --paper:#ffffff; --dim:#9a9a9a; --line:#e4e4e4; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f4f4f4; --paper:#0a0a0a; --dim:#6f6f6f; --line:#1f1f1f; } }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--paper); color:var(--ink);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  body { display:grid; grid-template-rows:auto 1fr auto; padding:clamp(20px,3.6vh,48px) clamp(24px,4.4vw,72px); }

  header { display:flex; justify-content:space-between; align-items:baseline; }
  header .who { font-size:clamp(15px,1.5vw,22px); letter-spacing:.42em; text-transform:uppercase; color:var(--dim); }
  header .clock { font-size:clamp(12px,1vw,15px); letter-spacing:.14em; color:var(--dim); font-variant-numeric:tabular-nums; }

  main { display:grid; align-content:center; justify-items:start; gap:clamp(10px,2vh,26px); }

  /* the state, deliberately enormous */
  .phase { display:flex; align-items:center; gap:clamp(14px,2vw,28px); }
  .phase .dot { width:clamp(20px,2.6vw,40px); height:clamp(20px,2.6vw,40px); border-radius:50%;
    background:var(--ink); flex:0 0 auto; }
  .phase .word { font-size:clamp(46px,9.2vw,148px); font-weight:700; letter-spacing:-.035em; line-height:.92; }
  .hint { font-size:clamp(15px,1.9vw,30px); color:var(--dim); letter-spacing:.01em; max-width:26ch; line-height:1.3; }

  /* listening: the dot breathes */
  body[data-phase="listening"] .dot { animation:breathe 1.1s ease-in-out infinite; }
  body[data-phase="listening"] .hint { color:var(--ink); }
  @keyframes breathe { 0%,100%{ transform:scale(1); opacity:1 } 50%{ transform:scale(.62); opacity:.35 } }

  /* thinking: a spinning ring, so "not listening" is a shape and not a word to read */
  body[data-phase="thinking"] .dot { background:transparent; border:clamp(4px,.55vw,9px) solid var(--ink);
    border-top-color:transparent; animation:rotate 1.6s linear infinite; }
  @keyframes rotate { to { transform:rotate(360deg) } }

  /* off: hollow and still */
  body[data-phase="off"] .dot { background:transparent; border:clamp(3px,.4vw,6px) solid var(--dim); }
  body[data-phase="off"] .word { color:var(--dim); }

  .exchange { display:grid; gap:clamp(8px,1.6vh,18px); margin-top:clamp(16px,3vh,40px); border-top:1px solid var(--line);
    padding-top:clamp(14px,2.2vh,26px); width:100%; }
  .row { display:grid; grid-template-columns:clamp(70px,7vw,120px) 1fr; gap:clamp(12px,1.6vw,24px); align-items:baseline; }
  .row .label { font-size:clamp(10px,.92vw,13px); letter-spacing:.22em; text-transform:uppercase; color:var(--dim); }
  .row .value { font-size:clamp(17px,1.9vw,30px); line-height:1.28; }
  .row.answer .value { font-weight:600; font-size:clamp(20px,2.5vw,40px); letter-spacing:-.01em; }
  .empty { color:var(--dim); font-weight:400; }

  footer { display:flex; flex-wrap:wrap; gap:8px 26px; border-top:1px solid var(--line); padding-top:14px;
    font-size:clamp(10px,.92vw,13px); letter-spacing:.1em; color:var(--dim); font-variant-numeric:tabular-nums; }
  footer b { color:var(--ink); font-weight:600; }
</style>
</head>
<body data-phase="off">
  <header>
    <div class="who">Kate</div>
    <div class="clock" id="clock"></div>
  </header>

  <main>
    <div class="phase">
      <span class="dot" id="dot"></span>
      <span class="word" id="word">Off</span>
    </div>
    <div class="hint" id="hint">connecting to the hub</div>

    <div class="exchange">
      <div class="row"><span class="label">heard</span><span class="value empty" id="heard">&mdash;</span></div>
      <div class="row answer"><span class="label">answer</span><span class="value empty" id="answer">&mdash;</span></div>
    </div>
  </main>

  <footer>
    <span>node <b id="ref">jims</b></span>
    <span>voice <b id="voice">&mdash;</b></span>
    <span>mic <b id="mic">&mdash;</b></span>
    <span>camera <b id="cam">none</b></span>
    <span>model <b id="model">&mdash;</b></span>
    <span>turn <b id="ms">&mdash;</b></span>
    <span>card <b id="lease">&mdash;</b></span>
  </footer>

<script>
const $ = (id) => document.getElementById(id);
const HUB = location.origin;

const PHASES = {
  awaiting:  { word: 'Say Kate',  hint: 'Waiting for the word. Nothing is being recorded.' },
  listening: { word: 'Listening', hint: 'Speak now — the microphone is open.' },
  thinking:  { word: 'Thinking',  hint: 'Not listening. Working out the answer, then it will speak.' },
  off:       { word: 'Off',       hint: 'The trigger is not armed. Nothing is being heard.' },
};

function paint(phase, extra) {
  const p = PHASES[phase] ? phase : 'off';
  document.body.dataset.phase = p;
  $('word').textContent = PHASES[p].word;
  $('hint').textContent = extra || PHASES[p].hint;
}

async function tick() {
  try {
    const s = await (await fetch(HUB + '/api/state', { cache: 'no-store' })).json();
    const lease = await (await fetch(HUB + '/api/gpu/lease', { cache: 'no-store' })).json().catch(() => ({}));

    // the hub owns the phase: only it knows when the microphone actually opened
    let phase = s.phase || 'off';
    if (s.last && s.last.error) phase = 'off';

    const last = s.last || {};
    paint(phase, null);

    $('ref').textContent = s.ref || 'jims';
    $('voice').textContent = (last.spoke && last.spoke.provider) || 'piper';
    $('mic').textContent = phase === 'listening' ? 'open' : (phase === 'off' ? 'closed' : 'on trigger');
    $('model').textContent = s.agent ? 'local qwen' : 'none';
    $('ms').textContent = last.ms ? (last.ms / 1000).toFixed(1) + ' s' : '\u2014';
    $('lease').textContent = lease.lease ? 'held by services' : 'free';

    if (last.transcript) { $('heard').textContent = last.transcript; $('heard').classList.remove('empty'); }
    const a = typeof last.answer === 'string' ? last.answer : (last.answer && (last.answer.answer || last.answer.why)) || null;
    if (a) { $('answer').textContent = a; $('answer').classList.remove('empty'); }
    if (last.error) { $('hint').textContent = 'Fault: ' + JSON.stringify(last.error).slice(0, 120); }

    $('clock').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    paint('off', 'No answer from the hub at ' + HUB);
  }
}
tick(); setInterval(tick, 900);
</script>
</body>
</html>
