<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echidna</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #191c23;
    --panel-2: #20242d;
    --line: #2a2f3a;
    --text: #e6e8ef;
    --muted: #8b93a7;
    --gold: #e7c84b;
    --green: #63bd58;
    --red: #e32636;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }
  /* the monitor owns the top: it is replaced, never scrolled, so it gets a fixed share and overflow hidden */
  .monitor { flex: 0 0 38%; min-height: 120px; display: flex; flex-direction: column; background: #0b0d11; border-bottom: 1px solid var(--line); }
  .monitor-head { display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .monitor-head .spacer { flex: 1; }
  .monitor-head button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12px; letter-spacing: .04em; }
  .monitor-head button:disabled { opacity: .3; cursor: default; }
  .monitor-head button:hover:not(:disabled) { color: var(--text); border-color: #3a4150; }
  .monitor-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 4px 44px 16px; overflow: hidden; }
  .monitor-kind { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  .monitor-title { font-size: clamp(17px, 6.2vh, 42px); line-height: 1.12; font-weight: 600; margin: 0 0 10px; }
  .monitor-text { font-size: clamp(12px, 1.9vh, 18px); color: #cfd4e0; max-width: 34em; margin: 0; }
  .monitor-empty { color: var(--muted); font-size: 16px; max-width: 30em; }
  /* a speaker card: the figure on the left, the line being said on the right, and the frame meter in the corner */
  .speaker { display: flex; align-items: center; gap: clamp(14px, 2.4vw, 34px); height: 100%; }
  .speaker figure { margin: 0; flex: 0 0 auto; height: 100%; display: flex; align-items: flex-end; }
  .speaker svg { height: 100%; width: auto; max-height: 100%; display: block; }
  .speaker .line { flex: 1 1 auto; min-width: 0; }
  .speaker .name { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .speaker .said { font-size: clamp(15px, 2.2vh, 26px); line-height: 1.25; color: #e6e8ef; margin: 0 0 10px; }
  .speaker .words { display: flex; gap: 8px; flex-wrap: wrap; }
  .speaker .words button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .speaker .words button:hover { border-color: var(--gold); }
  .meter { position: absolute; right: 12px; bottom: 8px; font: 11px/1 ui-monospace, monospace; color: #5d6474; letter-spacing: .04em; }
  /* the drag bar: same idiom as the Menu's golden-layout gutters, and it is a real handle, not a decoration */
  .splitter { flex: 0 0 7px; cursor: row-resize; background: #14171d; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; }
  .splitter::after { content: ''; position: absolute; left: 50%; top: 50%; width: 44px; height: 3px; margin: -1.5px 0 0 -22px; border-radius: 2px; background: #3a4150; }
  .splitter:hover::after, .splitter.drag::after { background: var(--gold); }
  .bottom { flex: 1 1 auto; display: flex; min-height: 0; }

  /* ---------- the conversation ---------- */
  .talk { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; border-right: 1px solid var(--line); }
  .talk-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .talk-head h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .chip.ok { color: var(--green); border-color: #29402a; }
  .chip.bad { color: var(--red); border-color: #4a1f24; }
  .spacer { flex: 1; }
  .talk-head button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .talk-head button:hover { color: var(--text); border-color: #3a4150; }

  .thread { flex: 1; overflow-y: auto; padding: 22px 22px 8px; scroll-behavior: smooth; }
  .turn { max-width: 46em; margin: 0 0 18px; }
  .turn .who { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .turn .body { white-space: pre-wrap; word-wrap: break-word; }
  .turn.you { margin-left: auto; }
  .turn.you .who { text-align: right; color: var(--gold); }
  .turn.you .body { background: var(--panel-2); border-radius: var(--radius); padding: 12px 14px; }
  .turn.echidna .who { color: var(--green); }
  .turn.note .who { color: var(--gold); letter-spacing: .1em; }
  .turn.note .body { border-left: 2px solid var(--gold); padding-left: 12px; color: #efe6c9; }
  .turn.system .who { color: var(--red); }
  .turn.system .body { border-left: 2px solid var(--red); padding-left: 12px; color: #f0c9cd; }
  .turn .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .empty { color: var(--muted); max-width: 40em; }
  .empty b { color: var(--text); font-weight: 600; }

  .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 18px 16px; }
  .composer textarea {
    width: 100%; min-height: 54px; max-height: 220px; resize: vertical;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; font: inherit;
  }
  .composer textarea:focus { outline: none; border-color: #3f4a5e; }
  .composer-row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .composer-row .hint { font-size: 11px; color: var(--muted); }
  .send {
    margin-left: auto; background: var(--gold); color: #14161b; border: 0; border-radius: 9px;
    padding: 9px 18px; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .send:disabled { opacity: .5; cursor: default; }
  .mic { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 8px 12px; cursor: pointer; }
  .mic.rec { border-color: var(--red); color: var(--red); }

  /* ---------- easy mode ---------- */
  .easy { overflow-y: auto; padding: 18px; background: var(--panel); flex: 0 0 340px; }
  .easy h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
  .easy h2:first-child { margin-top: 0; }
  .q { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .q .qtext { font-size: 26px; line-height: 1.25; font-weight: 600; margin-bottom: 14px; }
  .opt {
    display: block; width: 100%; text-align: left; margin: 8px 0; padding: 14px 16px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 16px; cursor: pointer;
  }
  .opt:hover { border-color: var(--gold); color: #fff; }
  .acts { display: grid; gap: 9px; }
  .act {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px; text-decoration: none;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; font-size: 15px;
  }
  .act:hover { border-color: #3f4a5e; }
  .act .ico { width: 22px; text-align: center; color: var(--gold); }
  .act .risk { margin-left: auto; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .media img, .media video { width: 100%; border-radius: 10px; display: block; }
  .media audio { width: 100%; }
  .media figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .none { color: var(--muted); font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; }
  .warn { color: var(--red); font-size: 13px; }
  .speech { font-size: 13px; color: var(--muted); }

  /* The stage in the Menu is ~700px wide, so the side-by-side layout has to survive that: Easy Mode narrows,
     it does not disappear below the conversation. Below 720px it stacks, because two 340px columns is worse. */
  @media (max-width: 980px) {
    .easy { flex-basis: 280px; }
    .monitor-body { padding: 8px 24px 20px; }
  }
  @media (max-width: 720px) {
    .bottom { flex-direction: column; }
    .talk { border-right: 0; border-bottom: 1px solid var(--line); }
    .easy { flex: 0 0 auto; max-height: 38vh; }
  }
  @media (prefers-reduced-motion: reduce) { .thread { scroll-behavior: auto; } }
  /* the answer as it is written: a real bubble with a caret, not a spinner that says nothing */
  .turn.live .caret { display: inline-block; margin-left: 2px; animation: caret 1s steps(1) infinite; opacity: .8; }
  @keyframes caret { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="app">
  <section class="monitor" id="monitor" aria-live="polite">
    <header class="monitor-head">
      <span>the monitor</span>
      <span class="spacer"></span>
      <button type="button" id="mon-voice" title="speak what the board shows">voice on</button>
      <button type="button" id="mon-back" disabled title="the previous card">‹ back</button>
    </header>
    <div class="monitor-body" id="monitor-body">
      <p class="monitor-empty">Nothing on the board. Ask below, and whatever is worth looking at lands here — a question, an output, a thing we made.</p>
    </div>
  </section>

  <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" tabindex="0" title="drag to resize"></div>

  <div class="bottom">
  <section class="talk">
    <header class="talk-head">
      <h1>Talk to Echidna</h1>
      <span class="chip" id="agent-chip">checking…</span>
      <span class="spacer"></span>
      <button type="button" id="clear">clear thread</button>
    </header>
    <div class="thread" id="thread"><p class="empty">reading the thread…</p></div>
    <div class="composer">
      <textarea id="say" placeholder="Say what you want. Enter sends, Shift+Enter adds a line." rows="2"></textarea>
      <div class="composer-row">
        <button type="button" class="mic" id="mic" hidden title="push to talk">🎤 hold to talk</button>
        <span class="hint" id="hint">one ask at a time · Win+H dictates into this box · the answer is the real agent, not a summary</span>
        <button type="button" class="send" id="send">Send</button>
      </div>
    </div>
  </section>

  <aside class="easy" id="easy">
    <p class="empty">reading easy mode…</p>
  </aside>
  </div>
</div>

<script>
(function () {
  'use strict';
  var threadEl = document.getElementById('thread');
  var easyEl = document.getElementById('easy');
  var sayEl = document.getElementById('say');
  var sendEl = document.getElementById('send');
  var micEl = document.getElementById('mic');
  var hintEl = document.getElementById('hint');
  var chipEl = document.getElementById('agent-chip');
  var clearEl = document.getElementById('clear');
  var monBody = document.getElementById('monitor-body');
  var monBack = document.getElementById('mon-back');
  var monVoice = document.getElementById('mon-voice');
  var monitorEl = document.getElementById('monitor');
  var splitterEl = document.getElementById('splitter');

  var state = { thread: [], easy: {}, agent: {}, busy: false, easyError: null, monitor: null, viewer: false, host: null, tts: null, draft: '' };
  // ?host=<ref> opens ANOTHER node's conversation. Same talk, read from the one node that hosts the agent.
  var HOST = new URLSearchParams(location.search).get('host');
  var thinkingSince = 0;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function when(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderThread() {
    if (!state.thread.length) {
      threadEl.innerHTML = '<div class="empty"><p><b>This is the conversation.</b> It is the same agent you would meet in a terminal — same tools, same book of jobs, same state — with the answers written down instead of scrolling past.</p><p>Type below, or tap something in Easy Mode on the right. One question at a time.</p></div>';
      return;
    }
    var html = state.thread.map(function (t) {
      var cls = t.role === 'you' ? 'you' : t.role === 'note' ? 'note' : (t.role === 'echidna' ? 'echidna' : 'system');
      var who = cls === 'you' ? 'you' : cls === 'note' ? 'arrived' : (cls === 'echidna' ? 'echidna' : 'echidna · could not answer');
      var meta = [];
      if (cls === 'echidna' && t.ms) meta.push((t.ms / 1000).toFixed(1) + 's');
      if (t.sessionId) meta.push('session ' + esc(t.sessionId));
      meta.push(when(t.at));
      return '<article class="turn ' + cls + '"><div class="who">' + who + '</div>' +
        '<div class="body">' + esc(t.text) + '</div>' +
        '<div class="meta">' + meta.join(' · ') + '</div></article>';
    }).join('');
    if (state.busy) {
      if (state.draft) {
        // the answer, as it arrives: a real bubble that grows rather than a spinner that says nothing
        html += '<article class="turn echidna live"><div class="who">echidna · writing</div>' +
          '<div class="body">' + esc(state.draft) + '<span class="caret">▍</span></div>' +
          '<div class="meta">' + Math.max(0, Math.round((Date.now() - thinkingSince) / 1000)) + 's</div></article>';
      } else {
        var s = Math.max(0, Math.round((Date.now() - thinkingSince) / 1000));
        html += '<article class="turn echidna"><div class="who">echidna · thinking</div><div class="body">' + s + 's…</div></article>';
      }
    }
    threadEl.innerHTML = html;
    threadEl.scrollTop = threadEl.scrollHeight;
  }

  // ── the speaker: a vector character that talks while the audio plays, then gets replaced by data ────────────
  // Drawing rules for a weak box: SVG built ONCE per card, then per frame we touch a handful of transforms and one
  // path. No filters, no blur, no shadows, no canvas re-layout - those are what make an i3 drop frames.
  var CHARS = null;
  var anim = null;

  function characterSpec(name) {
    var all = (CHARS && CHARS.characters) || {};
    return all[name] || all.narrator || null;
  }

  function buildSpeakerSvg(ch) {
    var sk = ch.palette.skin, hair = ch.palette.hair, cloth = ch.palette.cloth, accent = ch.palette.accent;
    var r = ch.head.r, jaw = ch.head.jaw;
    var ey = ch.eyes.y, edx = ch.eyes.dx, er = ch.eyes.r, lid = ch.eyes.lid;
    var my = ch.mouth.y, mw = ch.mouth.w;
    var hairStyle = ch.hair.style;
    // the cap ends ABOVE the brow line: hair that covers the face reads as a mask, not a person
    var cap = 'M -' + r + ' ' + (-r * 0.18) + ' q 0 -' + (r * 0.86) + ' ' + r + ' -' + (r * 0.86) +
              ' q ' + r + ' 0 ' + r + ' ' + (r * 0.86) + ' q -' + (r * 0.3) + ' ' + (r * 0.3) + ' 0 ' + (r * 0.12) +
              ' q ' + (r * 0.3) + ' -' + (r * 0.24) + ' 0 -' + (r * 0.12) + ' Z';
    var hairPath = hairStyle === 'long'
      ? cap + ' M -' + (r + 2) + ' ' + (-r * 0.1) + ' q -6 ' + (r * 0.5) + ' -2 ' + (r * 1.15) + ' l 10 0 q -6 -' + (r * 0.5) + ' 1 -' + (r * 1.1) + ' Z' +
        ' M ' + (r + 2) + ' ' + (-r * 0.1) + ' q 6 ' + (r * 0.5) + ' 2 ' + (r * 1.15) + ' l -10 0 q 6 -' + (r * 0.5) + ' -1 -' + (r * 1.1) + ' Z'
      : hairStyle === 'bob'
        ? cap + ' M -' + (r + 1) + ' ' + (-r * 0.05) + ' q -5 ' + (r * 0.35) + ' -3 ' + (r * 0.55) + ' l 8 0 q -4 -' + (r * 0.25) + ' 0 -' + (r * 0.5) + ' Z' +
          ' M ' + (r + 1) + ' ' + (-r * 0.05) + ' q 5 ' + (r * 0.35) + ' 3 ' + (r * 0.55) + ' l -8 0 q 4 -' + (r * 0.25) + ' 0 -' + (r * 0.5) + ' Z'
        : cap;
    return '' +
      '<svg viewBox="-78 -112 156 238" preserveAspectRatio="xMidYMax meet" aria-hidden="true">' +
        '<g id="sp-body">' +
          '<path d="M -' + ch.shoulders.w + ' 120 q 0 -46 ' + ch.shoulders.w + ' -46 q ' + ch.shoulders.w + ' 0 ' + ch.shoulders.w + ' 46 Z" fill="' + cloth + '"/>' +
          '<rect x="-9" y="' + (r - 14) + '" width="18" height="26" rx="7" fill="' + sk + '" opacity=".92"/>' +
          '<path d="M -12 ' + (ch.shoulders.y - 6) + ' q 12 8 24 0" stroke="' + accent + '" stroke-width="2.5" fill="none" opacity=".8"/>' +
        '</g>' +
        '<g id="sp-head">' +
          '<ellipse cx="0" cy="0" rx="' + r + '" ry="' + (r * jaw) + '" fill="' + sk + '"/>' +
          '<path d="' + hairPath + '" fill="' + hair + '" opacity=".96"/>' +
          '<g id="sp-eyes">' +
            '<ellipse cx="-' + edx + '" cy="' + ey + '" rx="' + (er + 2.4) + '" ry="' + (er + 1.4) + '" fill="#f4f2ee"/>' +
            '<ellipse cx="' + edx + '" cy="' + ey + '" rx="' + (er + 2.4) + '" ry="' + (er + 1.4) + '" fill="#f4f2ee"/>' +
            '<circle cx="-' + edx + '" cy="' + ey + '" r="' + er + '" fill="' + hair + '"/><circle cx="' + edx + '" cy="' + ey + '" r="' + er + '" fill="' + hair + '"/>' +
            '<circle cx="' + (edx - er * 0.4) + '" cy="' + (ey - er * 0.4) + '" r="1.1" fill="#fff" opacity=".9"/>' +
            '<rect id="sp-lid-l" x="-' + (edx + er + 3) + '" y="' + (ey - er - 2) + '" width="' + (2 * er + 6) + '" height="' + (2 * (er + 1.5)) + '" fill="' + sk + '" transform-origin="-' + edx + ' ' + (ey - er - 2) + '" transform="scale(1,' + (1 - lid) + ')"/>' +
            '<rect id="sp-lid-r" x="' + (edx - er - 3) + '" y="' + (ey - er - 2) + '" width="' + (2 * er + 6) + '" height="' + (2 * (er + 1.5)) + '" fill="' + sk + '" transform-origin="' + edx + ' ' + (ey - er - 2) + '" transform="scale(1,' + (1 - lid) + ')"/>' +
          '</g>' +
          '<path id="sp-brow-l" d="M -' + (edx + ch.brow.w / 2) + ' ' + ch.brow.y + ' q ' + ch.brow.w / 2 + ' -4 ' + ch.brow.w + ' 0" stroke="' + hair + '" stroke-width="' + ch.brow.thick + '" fill="none" stroke-linecap="round"/>' +
          '<path id="sp-brow-r" d="M ' + (edx - ch.brow.w / 2) + ' ' + ch.brow.y + ' q ' + ch.brow.w / 2 + ' -4 ' + ch.brow.w + ' 0" stroke="' + hair + '" stroke-width="' + ch.brow.thick + '" fill="none" stroke-linecap="round"/>' +
          '<ellipse id="sp-mouth" cx="0" cy="' + my + '" rx="' + mw + '" ry="2" fill="#5b2b30"/>' +
          '<ellipse id="sp-mouth-in" cx="0" cy="' + (my + 1) + '" rx="' + (mw - 4) + '" ry="1" fill="#2a1013"/>' +
          '<path d="M -3 ' + (my - 9) + ' q 3 2 6 0" stroke="' + sk + '" stroke-width="2" fill="none" opacity=".5"/>' +
        '</g>' +
      '</svg>';
  }

  function stopAnim() {
    if (anim) {
      cancelAnimationFrame(anim.raf);
      try { anim.audio.pause(); } catch (e) { /* already gone */ }
      try { anim.ctx && anim.ctx.close(); } catch (e) { /* already closed */ }
      anim = null;
    }
  }

  // One rAF loop, adaptive: it measures its own frame cost and steps quality down rather than stuttering. The meter
  // is there so the operator can see the cost on THEIR box, because this box is not the weak one.
  function startSpeaker(card, host) {
    stopAnim();
    var ch = characterSpec(card.character || 'narrator');
    var figure = host.querySelector('.speaker figure');
    var saidEl = host.querySelector('.said');
    var meter = host.querySelector('.meter');
    if (!ch || !figure) return;
    figure.innerHTML = buildSpeakerSvg(ch);
    var head = figure.querySelector('#sp-head');
    var mouth = figure.querySelector('#sp-mouth');
    var mouthIn = figure.querySelector('#sp-mouth-in');
    var lids = [figure.querySelector('#sp-lid-l'), figure.querySelector('#sp-lid-r')];
    var mw = ch.mouth.w, my = ch.mouth.y;

    var audio = card.audio ? new Audio(card.audio) : new Audio();
    var needsLanVoice = !card.audio;
    audio.preload = 'auto';
    var ctx = null, srcNode = null, analyser = null, buf = null;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      srcNode = ctx.createMediaElementSource(audio);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 256;               // small on purpose: 128 samples is plenty for a mouth
      analyser.smoothingTimeConstant = 0.6;
      srcNode.connect(analyser);
      analyser.connect(ctx.destination);
      buf = new Uint8Array(analyser.fftSize);
    } catch (e) {
      // no WebAudio (rare): the mouth falls back to a slow idle pulse so the figure is still alive
      ctx = null;
    }

    var fpsTarget = 24, level = 0;         // 0 full, 1 no sway, 2 mouth only at 12, 3 static
    var frameMs = 0, lastFrame = 0, lastTick = performance.now(), frames = 0, blinkAt = performance.now() + 2400;
    var open = 0, sway = 0, t = 0, voiceLabel = '';

    function tick(now) {
      if (!anim) return;
      anim.raf = requestAnimationFrame(tick);
      var dt = now - lastTick;
      if (dt < 1000 / fpsTarget - 1) return;          // render at the target, not as fast as the box will go
      frames += 1;
      lastTick = now;
      t += dt / 1000;
      var workStart = performance.now();

      // amplitude -> mouth: the only per-frame work that matters
      var amp = 0;
      if (analyser) {
        analyser.getByteTimeDomainData(buf);
        var sum = 0;
        for (var i = 0; i < buf.length; i += 1) { var v = (buf[i] - 128) / 128; sum += v * v; }
        amp = Math.sqrt(sum / buf.length);
      } else {
        amp = 0.12 + 0.1 * Math.sin(t * 9);
      }
      open = open * 0.55 + Math.min(1, amp * 4.2) * 0.45;
      var ry = 1.6 + open * 9.5;
      mouth.setAttribute('ry', ry.toFixed(1));
      mouthIn.setAttribute('ry', Math.max(0.8, ry - 2.4).toFixed(1));
      mouthIn.setAttribute('cy', (my + 1 + (ry - 1.6) * 0.25).toFixed(1));

      if (level < 2) {
        sway = Math.sin(t * 0.9) * 0.9;
        head.setAttribute('transform', 'translate(' + sway.toFixed(2) + ',' + (Math.sin(t * 1.3) * 0.6).toFixed(2) + ')');
      }
      if (level === 0 && now > blinkAt) {
        var ph = (now - blinkAt) / 130;
        var closed = ph < 1 ? (ph < 0.5 ? ph * 2 : (1 - ph) * 2) : 0;
        lids[0].setAttribute('transform', 'scale(1,' + (1 - Math.max(0.06, closed)).toFixed(2) + ')');
        lids[1].setAttribute('transform', 'scale(1,' + (1 - Math.max(0.06, closed)).toFixed(2) + ')');
        if (ph >= 1) blinkAt = now + 2200 + Math.random() * 2600;
      }

      // how long the DRAWING took, which is the number that decides whether an i3 can do this
      var cost = performance.now() - workStart;
      frameMs = frameMs ? frameMs * 0.8 + cost * 0.2 : cost;

      // the meter, once a second, and the downgrade that keeps a weak box usable
      if (!anim.lastMeter || now - anim.lastMeter > 1000) {
        anim.lastMeter = now;
        if (meter) {
          meter.textContent = (voiceLabel ? voiceLabel + ' · ' : '') + fpsTarget + ' fps · ' + frameMs.toFixed(2) + ' ms/draw' +
            ' · amp ' + amp.toFixed(2) + (level ? ' · lite ' + level : '');
        }
        // measured, not assumed: a draw costing more than 8 ms cannot hold 24 fps inside a busy page
        if (frameMs > 8 && level < 3) { level += 1; fpsTarget = level >= 2 ? 12 : 18; }
        else if (frameMs < 2 && level > 0) { level -= 1; fpsTarget = level >= 2 ? 12 : 24; }
      }
      if (saidEl && card.text) saidEl.textContent = card.text;
    }

    anim = { raf: 0, audio: audio, ctx: ctx, lastMeter: 0 };
    anim.raf = requestAnimationFrame(tick);
    var play = function () {
      if (!needsLanVoice) { audio.play().catch(function () { /* autoplay may need a click */ }); return; }
      // no file on the card: the LAN speaks it. One request, one wav, nothing synthesised in this pane.
      fetch('api/speak', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text: card.text || '', character: card.character || 'narrator' })
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || 'the voice is off'); });
        var provider = r.headers.get('x-tts-provider') || 'lan';
        voiceLabel = 'voice ' + provider;
        return r.blob();
      }).then(function (blob) {
        audio.src = URL.createObjectURL(blob);
        audio.play().catch(function () { voiceLabel = 'voice ready — click to hear'; });
      }).catch(function (e) { voiceLabel = 'voice: ' + e.message; });
    };
    play();
    host.addEventListener('click', function () { if (audio.paused) play(); }, { once: true });
    audio.addEventListener('ended', function () {
      if (meter) meter.textContent = '';
      // the narrator hands back to the data: the line stays, the acting stops
      if (head) head.setAttribute('transform', 'translate(0,0)');
      mouth.setAttribute('ry', '1.8');
    });
  }

  // The monitor: one card, always replaced, never scrolled. A news caster's screen behind him - the thing worth
  // looking at RIGHT NOW. Back walks the few cards that were replaced; it is a stack of one-line memories, not a feed.
  function renderMonitor() {
    var m = state.monitor;
    if (!m || !m.card || m.card.kind !== 'speaker') stopAnim();
    if (m && m.card && m.card.kind === 'speaker') {
      var c0 = m.card;
      var ch0 = characterSpec(c0.character || 'narrator');
      var opts = (c0.options || []).map(function (o) {
        return '<button type="button" data-answer="' + esc(o) + '">' + esc(o) + '</button>';
      }).join('');
      monBody.innerHTML = '<div class="speaker"><figure></figure><div class="line">' +
        '<div class="name">' + esc((ch0 && ch0.name) || 'narrator') + '</div>' +
        '<p class="said">' + esc(c0.text || '') + '</p>' +
        (opts ? '<div class="words">' + opts + '</div>' : '') +
        '</div><div class="meter" id="sp-meter"></div></div>';
      startSpeaker(c0, monBody);
      monBack.disabled = !(m.index > 0);
      return;
    }
    if (!m || !m.card) {
      monBody.innerHTML = '<p class="monitor-empty">Nothing on the board. Ask below, and whatever is worth looking at lands here — a question, an output, a thing we made.</p>';
      monBack.disabled = true;
      return;
    }
    var c = m.card;
    var kind = c.kind === 'question' ? 'the question' : c.kind === 'output' ? 'the output' : (c.kind || 'the board');
    var html = '<div class="monitor-kind">' + esc(kind) + (m.index > 0 ? ' · ' + (m.index + 1) + ' of ' + m.total : '') + '</div>';
    if (c.title) html += '<h2 class="monitor-title">' + esc(c.title) + '</h2>';
    if (c.text) html += '<p class="monitor-text">' + esc(c.text) + '</p>';
    monBody.innerHTML = html;
    monBack.disabled = !(m.index > 0);
  }

  function renderEasy() {
    var easy = state.easy || {};
    var out = '';
    if (state.easyError) out += '<p class="warn">' + esc(state.easyError) + '</p>';

    if (easy.question && easy.question.text) {
      out += '<h2>one question</h2><div class="q"><div class="qtext">' + esc(easy.question.text) + '</div>';
      (easy.question.options || []).forEach(function (o) {
        out += '<button type="button" class="opt" data-answer="' + esc(o) + '">' + esc(o) + '</button>';
      });
      out += '</div>';
    }

    var actions = easy.actions || [];
    out += '<h2>launch</h2>';
    if (actions.length) {
      out += '<div class="acts">';
      actions.forEach(function (a) {
        if (a.url) {
          out += '<a class="act" href="' + esc(a.url) + '" target="_blank" rel="noreferrer"><span class="ico">' + esc(a.icon || '▸') +
            '</span><span>' + esc(a.name) + '</span><span class="risk">' + esc(a.risk || '') + '</span></a>';
        } else {
          out += '<span class="act"><span class="ico">' + esc(a.icon || '▸') + '</span><span>' + esc(a.name) +
            '</span><span class="risk">not wired</span></span>';
        }
      });
      out += '</div>';
    } else {
      out += '<p class="none">Nothing declared yet. Actions are written in <code>data/easy.json</code> before they appear — the pane never invents one.</p>';
    }

    var media = easy.media || [];
    if (media.length) {
      out += '<h2>what we made</h2><div class="media">';
      media.slice(0, 4).forEach(function (m) {
        var cap = m.caption ? '<figcaption>' + esc(m.caption) + '</figcaption>' : '';
        if (m.type === 'audio') out += '<figure style="margin:0 0 12px">' + '<audio controls src="' + esc(m.src) + '"></audio>' + cap + '</figure>';
        else if (m.type === 'video') out += '<figure style="margin:0 0 12px">' + '<video controls src="' + esc(m.src) + '"></video>' + cap + '</figure>';
        else out += '<figure style="margin:0 0 12px">' + '<img alt="' + esc(m.caption || '') + '" src="' + esc(m.src) + '">' + cap + '</figure>';
      });
      out += '</div>';
    }

    var sp = easy.speech || {};
    out += '<h2>speech</h2><div class="speech">';
    out += sp.tts ? 'out loud: ' + esc(sp.tts.label || sp.tts.url) : 'no speech service declared on this LAN (text only)';
    out += '<br>';
    out += sp.stt
      ? 'listening: ' + esc(sp.stt.label || sp.stt.url) + (sp.stt.kind === 'os' ? ' — press Win+H and talk into this box' : '')
      : 'no listening service declared on this LAN';
    out += '</div>';

    easyEl.innerHTML = out;

    var hasStt = !!(easy.speech && easy.speech.stt && easy.speech.stt.url);
    micEl.hidden = !hasStt;
  }

  // the voice switch: on means the board may speak; off means silence even for a speaker card
  function renderVoice() {
    if (!monVoice) return;
    var on = !!(state.tts && state.tts.enabled);
    monVoice.textContent = on ? 'voice on' : 'voice off';
    monVoice.style.color = on ? 'var(--green)' : 'var(--muted)';
  }

  function renderChip() {
    var a = state.agent || {};
    if (state.viewer) { chipEl.className = 'chip'; chipEl.textContent = 'hosted on ' + state.host; return; }
    if (state.busy) { chipEl.className = 'chip'; chipEl.textContent = 'answering…'; return; }
    if (a.present === false) { chipEl.className = 'chip bad'; chipEl.textContent = 'no agent binary'; return; }
    chipEl.className = 'chip ok';
    chipEl.textContent = a.session ? 'agent ready · continuing a session' : 'agent ready';
  }

  function render() { renderMonitor(); renderThread(); renderEasy(); renderChip(); renderVoice(); }

  function load() {
    var convUrl = 'api/conversation' + (HOST ? '?host=' + encodeURIComponent(HOST) : '');
    return Promise.all([
      fetch(convUrl, { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('api/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return {}; })
    ]).then(function (both) {
      var conv = both[0] || {};
      var local = both[1] || {};
      state.thread = conv.thread || local.thread || [];
      state.monitor = conv.monitor || local.monitor || null;
      state.agent = conv.agent || local.agent || {};
      state.easy = local.easy || {};
      if (local.characters) CHARS = local.characters;
      state.tts = local.tts || null;
      state.easyError = local.easyError || null;
      state.viewer = !!conv.viewer;
      state.host = conv.host || null;
      state.busy = !!local.busy && !state.viewer;
      if (conv.ok === false) {
        state.thread = [];
        state.monitor = null;
        chipEl.className = 'chip bad';
        chipEl.textContent = conv.error || 'no conversation';
      }
      render();
      if (state.viewer) {
        sayEl.disabled = true;
        sayEl.placeholder = 'This conversation is hosted on node ' + state.host + '. Talk to it there.';
        sendEl.disabled = true;
      }
    }).catch(function (e) {
      chipEl.className = 'chip bad';
      chipEl.textContent = 'door unreachable';
      hintEl.textContent = String(e.message || e);
    });
  }

  function send() {
    var text = sayEl.value.trim();
    if (!text || state.busy) return;
    state.busy = true;
    state.draft = '';
    thinkingSince = Date.now();
    sayEl.value = '';
    render();
    hintEl.textContent = 'asking the real agent — the answer arrives as it is written';

    // SSE by hand, because the ask is a POST and EventSource only does GET. Each frame has a name so a delta can never
    // be mistaken for a finished turn: 'turn' is the question on the record, 'delta' is words in flight, 'done' is the
    // published answer that is also in the thread file.
    fetch('api/say/stream', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: text })
    }).then(function (r) {
      if (!r.ok) {
        return r.json().then(function (j) {
          hintEl.textContent = (j && j.error) || 'the ask failed';
          state.busy = false;
          render();
        }).catch(function () {
          hintEl.textContent = 'the ask failed (' + r.status + ')';
          state.busy = false;
          render();
        });
      }
      if (!r.body || !r.body.getReader) {
        hintEl.textContent = 'this browser cannot read the stream';
        state.busy = false;
        return;
      }
      var reader = r.body.getReader();
      var dec = new TextDecoder();
      var buf = '';

      function handleFrame(raw) {
        if (!raw || raw.charAt(0) === ':') return;
        var ev = 'message', data = '';
        raw.split('\n').forEach(function (line) {
          if (line.indexOf('event:') === 0) ev = line.slice(6).trim();
          else if (line.indexOf('data:') === 0) data += line.slice(5).trim();
        });
        if (!data) return;
        var j;
        try { j = JSON.parse(data); } catch (e) { return; }
        if (ev === 'turn') {
          state.thread.push(j.turn);
          state.draft = '';
          render();
          hintEl.textContent = 'echidna is answering…';
        } else if (ev === 'delta') {
          state.draft += (j.text || '');
          renderThread();
        } else if (ev === 'meta') {
          if (j.tokens) hintEl.textContent = 'echidna is answering… (' + (j.tokens.output || 0) + ' tokens so far)';
        } else if (ev === 'done') {
          if (j.turn) state.thread.push(j.turn);
          state.draft = '';
          state.busy = false;
          thinkingSince = Date.now();
          hintEl.textContent = j.ok
            ? 'done · ' + ((j.ms || 0) / 1000).toFixed(1) + 's' + (j.tokens ? ' · ' + (j.tokens.output || 0) + ' tokens out' : '')
            : 'echidna could not answer — see the thread';
          render();
          load();
        } else if (ev === 'fail') {
          state.draft = '';
          state.busy = false;
          hintEl.textContent = 'stream failed: ' + (j.error || 'unknown');
          render();
        }
      }

      function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) {
            if (buf.trim()) handleFrame(buf);
            state.busy = false;
            state.draft = '';
            render();
            return;
          }
          buf += dec.decode(chunk.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            var raw = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            handleFrame(raw);
          }
          return pump();
        });
      }
      return pump();
    }).catch(function (e) {
      hintEl.textContent = 'send failed: ' + String((e && e.message) || e);
      state.busy = false;
      state.draft = '';
      render();
    });
  }

  sendEl.addEventListener('click', send);
  sayEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  easyEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-answer]');
    if (!btn) return;
    sayEl.value = btn.getAttribute('data-answer');
    sayEl.focus();
  });
  clearEl.addEventListener('click', function () {
    if (!confirm('Empty the thread? The turns are gone; the file stays empty.')) return;
    fetch('api/clear', { method: 'POST' }).then(load);
  });

  monVoice.addEventListener('click', function () {
    var on = !!(state.tts && state.tts.enabled);
    fetch('api/tts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ enabled: !on }) })
      .then(function () { if (on) stopAnim(); return load(); });
  });

  monBack.addEventListener('click', function () {
    fetch('api/monitor/back', { method: 'POST' }).then(load);
  });

  // the drag bar: the monitor's share of the window, remembered. Pointer capture so the drag survives the cursor
  // leaving the 7px handle - a handle you have to chase is not a handle.
  (function () {
    var saved = parseFloat(localStorage.getItem('echidna-monitor-share') || '');
    if (saved > 8 && saved < 85) monitorEl.style.flexBasis = saved + '%';
    var dragging = false;
    function shareFromEvent(e) {
      var total = window.innerHeight;
      var y = e.clientY;
      return Math.max(8, Math.min(85, (y / total) * 100));
    }
    splitterEl.addEventListener('pointerdown', function (e) {
      dragging = true;
      splitterEl.classList.add('drag');
      splitterEl.setPointerCapture(e.pointerId);
    });
    splitterEl.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      monitorEl.style.flexBasis = shareFromEvent(e).toFixed(2) + '%';
    });
    splitterEl.addEventListener('pointerup', function (e) {
      if (!dragging) return;
      dragging = false;
      splitterEl.classList.remove('drag');
      try { splitterEl.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
      localStorage.setItem('echidna-monitor-share', parseFloat(monitorEl.style.flexBasis).toFixed(2));
    });
    // keyboard: the separator is focusable, so arrows move it like a real gutter
    splitterEl.addEventListener('keydown', function (e) {
      var cur = parseFloat(monitorEl.style.flexBasis) || 38;
      if (e.key === 'ArrowUp') { monitorEl.style.flexBasis = Math.max(8, cur - 4) + '%'; e.preventDefault(); }
      if (e.key === 'ArrowDown') { monitorEl.style.flexBasis = Math.min(85, cur + 4) + '%'; e.preventDefault(); }
    });
  })();

  load();
  setInterval(function () { if (!state.busy) load(); else renderThread(); }, 5000);
})();
</script>
</body>
</html>
